<style>
:root {
  --bg: #f4f6f9; --card: #ffffff; --ink: #1b2430; --muted: #566274; --line: #d9dfe7; --soft: #e9eef5;
  --primary: #1f3a5f; --primary-ink: #ffffff; --accent: #3b6ea5; --accent-soft: #e6edf5;
  --ok-bg: #e3f1e8; --ok-ink: #1d5c36; --warn-bg: #fbeed5; --warn-ink: #7a4a00; --grey-bg: #eceff3; --grey-ink: #4a5565;
  --err-bg: #fbe5e3; --err-ink: #8a1f17; --focus: #0b57d0; --radius: 18px;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121820; --card: #1a2330; --ink: #e8edf3; --muted: #9fb0c4; --line: #2b3a4d; --soft: #223044;
    --primary: #8fb4e6; --primary-ink: #0f1c2e; --accent: #8fb4e6; --accent-soft: #1f3047;
    --ok-bg: #173a24; --ok-ink: #9fdcb4; --warn-bg: #3f2a10; --warn-ink: #ffc58a; --grey-bg: #2a3544; --grey-ink: #aab7c8;
    --err-bg: #3c1a17; --err-ink: #ffb4ab; --focus: #8ab4f8;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.7 var(--sans); }
h1, h2, h3 { font-family: var(--sans); font-weight: 600; letter-spacing: -.01em; color: var(--ink); }
h2 { font-size: 28px; line-height: 1.25; margin: 12px 0 22px; }
h3 { font-size: 20px; margin: 36px 0 10px; }
p { margin: 0 0 22px; }
.shell { width: 100%; margin: 0 auto; padding: 14px 16px 90px; }
@media (min-width: 600px) { .shell { padding: 16px 24px 100px; } }
@media (min-width: 1100px) { .shell { padding: 18px 40px 110px; } }
@media (min-width: 1700px) { .shell { padding: 20px 64px 120px; } }
.nav { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 10px 8px 14px; position: sticky; top: 8px; z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; min-width: 0; }
.brand i { flex: 0 0 auto; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 8px; background: var(--primary); color: var(--primary-ink); font: 700 15px var(--sans); font-style: normal; }
.brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save { font-size: 13px; color: var(--muted); background: var(--soft); border-radius: 999px; padding: 6px 12px; white-space: nowrap; }
.save.warn { background: var(--warn-bg); color: var(--warn-ink); }
.layout { display: block; margin-top: 22px; }
/* progress bar: one segment for each stop, above the pills */
.prog { margin: 0 0 16px; }
.segs { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; }
.seg { flex: 1 1 0; min-width: 0; }
.segbtn { display: block; width: 100%; text-align: left; font: inherit; background: none; border: 0; padding: 6px 0 2px; margin: 0; cursor: pointer; color: var(--muted); }
.segbtn:disabled { cursor: default; }
.seg:not(.done):not(.cur) .segbtn { opacity: .6; }
.track { display: block; height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; }
.track i { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .25s; }
.lab, .labn { display: none; font-size: 13px; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg.cur .lab, .seg.cur .labn { color: var(--ink); font-weight: 600; }
@media (min-width: 1100px) { .lab { display: block; } .segs { gap: 8px; } }
@media (min-width: 600px) and (max-width: 1099px) { .labn { display: block; } .seg.cur .labn { display: none; } .seg.cur .lab { display: block; } }
@media (max-width: 599px) { .segs { gap: 4px; } .track { height: 6px; } .segbtn { pointer-events: none; } }
.pills { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 22px; }
@media (max-width: 599px) { .pills { flex-direction: column; align-items: flex-start; } }
.pill.plain { font-weight: 500; color: var(--ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; color: var(--muted); }
.pill b { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px 28px; margin-bottom: 26px; }
@media (min-width: 1100px) { .card { padding: 40px 48px; } }
@media (max-width: 520px) { .card { padding: 24px 16px; } h2 { font-size: 24px; } }
.lead { font-size: 20px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin: 28px 0 26px; }
.tile { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.tile > b { display: block; font-size: 26px; font-weight: 600; color: var(--primary); }
.tile span { font-size: 14px; color: var(--muted); }
.tile span b, .tile > b b { display: inline; font-size: inherit; font-weight: 700; color: inherit; }
.tile span b { color: var(--ink); }
.two { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 620px) { .two { grid-template-columns: 1fr 1fr; } }
.box { border-radius: 14px; padding: 16px; border: 1px solid var(--line); }
.box.yes { background: var(--ok-bg); }
.box.no { background: var(--warn-bg); }
.box h3 { margin-top: 0; font-size: 18px; }
.box ul { margin: 0; padding-left: 20px; }
.box li { margin-bottom: 6px; }
ul.plain { padding-left: 22px; margin: 0 0 24px; }
ul.plain li { margin-bottom: 10px; }
.note { border: 1px solid var(--accent); background: var(--accent-soft); padding: 16px 20px; border-radius: 14px; font-size: 16px; margin: 26px 0; }
blockquote.legal { margin: 0 0 14px; padding: 14px 16px; background: var(--soft); border: 1px solid var(--line); border-radius: 14px; font-size: 16px; }
.q { margin: 0 0 36px; }
.q + .q { border-top: 1px solid var(--line); padding-top: 32px; }
.q .t { display: block; font-weight: 600; margin-bottom: 6px; }
.help { font-size: 15px; color: var(--muted); margin: 0 0 12px; }
.ex-hint { font-style: italic; }
.qno { display: none; font: 12px/1.2 ui-monospace, Consolas, monospace; background: var(--accent-soft); color: var(--ink); padding: 2px 7px; border-radius: 999px; margin-right: 6px; vertical-align: 2px; border: 1px solid var(--line); }
body.qnos .qno { display: inline-block; }
.opt { display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px; margin-bottom: 10px; border: 1px solid var(--line); border-radius: 14px; cursor: pointer; background: var(--card); min-height: 48px; }
.opt:hover { border-color: var(--accent); }
.opt input { margin-top: 5px; width: 20px; height: 20px; flex: 0 0 auto; accent-color: var(--primary); }
.opt.sel { border-color: var(--primary); background: var(--accent-soft); }
.opt.off { opacity: .5; }
input[type="text"], input[type="password"], input[type="email"], input[type="file"], textarea, select { width: 100%; font: inherit; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); min-height: 48px; }
textarea { min-height: 110px; resize: vertical; }
textarea[id^="ot_"] { min-height: 72px; }
.counter { font-size: 13px; color: var(--muted); text-align: right; }
.counter.over { color: var(--warn-ink); font-weight: 600; }
.rate { display: grid; grid-template-columns: 1fr; gap: 8px; padding: 20px 0; border-top: 1px solid var(--line); }
.rate:first-of-type { border-top: 0; }
.rate .name { font-weight: 600; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg label { flex: 1 1 0; min-width: 46px; text-align: center; border: 1px solid var(--line); border-radius: 999px; padding: 10px 8px; cursor: pointer; background: var(--card); font-size: 16px; min-height: 44px; }
.seg label.wide { flex: 1 1 120px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label.sel { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
.seg label:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.scale-note { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
.rank { display: grid; gap: 8px; }
.rank button.item { display: flex; align-items: center; gap: 12px; text-align: left; font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 14px; padding: 10px 14px; min-height: 48px; cursor: pointer; }
.rank button.item .n { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.rank button.item.on { border-color: var(--primary); background: var(--accent-soft); }
.rank button.item.on .n { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.nav2 { display: flex; gap: 10px; justify-content: space-between; margin-top: 8px; }
button.btn { font: inherit; font-weight: 600; padding: 12px 26px; border-radius: 999px; border: 1px solid var(--primary); cursor: pointer; min-height: 48px; background: var(--primary); color: var(--primary-ink); }
button.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
button.btn:disabled { opacity: .4; cursor: not-allowed; }
button:focus-visible, .opt:focus-within, a:focus-visible, summary:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.term { font: inherit; color: var(--accent); background: none; border: 0; border-bottom: 1.5px dotted var(--accent); padding: 0; cursor: help; }
#gloss { position: absolute; width: min(340px, calc(100vw - 24px)); z-index: 20; background: var(--card); border: 1px solid var(--primary); border-radius: 14px; padding: 12px 40px 14px 16px; box-shadow: 0 8px 26px rgba(0,0,0,.22); display: none; font-size: 16px; line-height: 1.45; }
#gloss.on { display: block; }
#gloss b { display: block; font-size: 17px; font-weight: 600; margin-bottom: 2px; }
#gloss .gd { display: block; }
#gloss .gx { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border-radius: 50%; border: 0; background: var(--soft); color: var(--ink); font-size: 20px; line-height: 1; cursor: pointer; }
#gloss::before { content: ""; position: absolute; top: -8px; left: calc(var(--ax, 50%) - 8px); width: 14px; height: 14px; background: var(--card); border-left: 1px solid var(--primary); border-top: 1px solid var(--primary); transform: rotate(45deg); }
#gloss.up::before { top: auto; bottom: -8px; transform: rotate(225deg); }
.navr { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.langbtn { font: inherit; font-size: 14px; font-weight: 600; padding: 6px 14px; min-height: 36px; border-radius: 999px; border: 1px solid var(--primary); background: var(--card); color: var(--primary); cursor: pointer; }
.langbtn[hidden] { display: none; }
.doi { display: inline-block; font-size: 13px; font-weight: 500; margin: 0 4px 0 6px; color: var(--accent); word-break: break-all; }
a.doi { text-decoration: underline; }
.opt-card { border: 1.5px solid var(--line); }
.letter { display: inline-grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--primary); color: var(--primary-ink); font: 600 21px var(--sans); margin-right: 12px; vertical-align: middle; }
.field { margin: 0 0 14px; }
.field .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 2px; font-weight: 600; }
.field p { margin: 0; }
details { border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; margin: 18px 0; background: var(--card); }
details summary { cursor: pointer; font-weight: 600; padding: 10px 0; min-height: 44px; }
details[open] { background: var(--soft); }
details details { background: var(--card); margin: 8px 0; }
details details[open] { background: var(--card); }
details details summary { font-weight: 600; font-size: 16px; }
.chip { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 999px; padding: 2px 10px; margin-left: 6px; vertical-align: 1px; }
.chip.Supports { background: var(--ok-bg); color: var(--ok-ink); }
.chip.Challenges { background: var(--warn-bg); color: var(--warn-ink); }
.chip.Mixed { background: var(--grey-bg); color: var(--grey-ink); }
.sec-h { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 16px 0 4px; font-weight: 600; }
.study .k { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; margin: 8px 0 0; }
.study p { margin: 0 0 6px; font-size: 16px; }
.cmp { overflow-x: auto; margin: 0 -4px; }
.cmp table { border-collapse: collapse; min-width: 720px; font-size: 15px; }
.cmp th, .cmp td { border: 1px solid var(--line); padding: 8px 10px; vertical-align: top; text-align: left; }
.cmp th { background: var(--soft); font-weight: 600; }
.cmp td:first-child, .cmp th:first-child { position: sticky; left: 0; background: var(--card); font-weight: 600; min-width: 110px; }
.msg { margin-top: 12px; padding: 10px 14px; border-radius: 14px; background: var(--soft); }
.msg.err { background: var(--err-bg); color: var(--err-ink); }
.msg.ok { background: var(--ok-bg); color: var(--ok-ink); }
.foot { margin-top: 28px; font-size: 13px; color: var(--muted); text-align: center; }
.sr { position: absolute; left: -9999px; }
[hidden] { display: none !important; }

.stars { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.star { position: relative; cursor: pointer; font-size: 34px; line-height: 1; padding: 2px 3px; color: var(--muted); }
.star.on { color: #b07a00; }
.star input, .dk input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.star:focus-within, .dk:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.dk { margin-left: 14px; font-size: 15px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
.dk.sel { background: var(--accent-soft); border-color: var(--primary); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* dumbbell chart */
.dbl { margin: 30px 0; }
.dbl-t { font-weight: 600; margin: 0 0 10px; }
.dbl-leg { display: flex; gap: 24px; flex-wrap: wrap; font-size: 14px; margin: 0 0 10px; }
.dbl-leg span { display: inline-flex; align-items: center; gap: 8px; }
.dbl .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; }
.dbl .dot.a { background: var(--card); border: 3px solid var(--accent); }
.dbl .dot.b { background: var(--primary); border: 3px solid var(--primary); }
.dbl-row, .dbl-axis { display: grid; grid-template-columns: minmax(160px, 28%) 1fr minmax(130px, 16%); gap: 16px; align-items: center; }
.dbl-row { padding: 14px 0; border-top: 1px solid var(--line); }
.dbl-l { font-weight: 600; font-size: 16px; line-height: 1.35; }
.dbl-l small { display: block; font-weight: 400; color: var(--muted); font-size: 13px; }
.dbl-plot { position: relative; height: 30px; margin: 0 40px; }
.dbl-plot .grid { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.dbl-plot .bar { position: absolute; top: 50%; height: 5px; margin-top: -2.5px; background: var(--accent); opacity: .5; border-radius: 3px; }
.dbl-plot .dot { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; }
.dbl-plot .v { position: absolute; top: 50%; font-size: 14px; font-weight: 600; white-space: nowrap; }
.dbl-plot .v.l { transform: translate(calc(-100% - 14px), -50%); }
.dbl-plot .v.r { transform: translate(14px, -50%); }
.dbl-axis { margin-bottom: 2px; }
.dbl-axis .dbl-plot { height: 20px; }
.dbl-axis em { position: absolute; top: 0; transform: translateX(-50%); font-style: normal; font-size: 12px; color: var(--muted); }
.dbl-d b { display: block; font-size: 20px; }
.dbl-d small { color: var(--muted); font-size: 13px; }
.dbl-d.none b { color: var(--muted); }
@media (max-width: 699px) {
  .dbl-row, .dbl-axis { grid-template-columns: 1fr; gap: 8px; }
  .dbl-axis > span { display: none; }
  .dbl-plot { margin: 0 36px; }
  .dbl-d { display: flex; gap: 10px; align-items: baseline; }
}
/* NHETE consultation extensions; retains the PK app's typography and card system. */
[hidden] { display: none !important; }
.shell { max-width: 1360px; }
.navr { display: flex; align-items: center; gap: 8px; }
#main { margin-top: 28px; }
.intro { max-width: 860px; margin: 30px auto; }
h1 { font-size: clamp(28px, 4vw, 44px); line-height: 1.2; }
fieldset { min-width: 0; border: 0; margin: 0; padding: 0; }
legend { font-weight: 600; margin-bottom: 14px; width: 100%; }
.section-nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
.section-nav button { font-size: 14px; padding: 8px 12px; }
.section-nav button[aria-current="step"] { background: var(--primary); color: var(--primary-ink); }
.review-heading { margin: 0 0 12px; }
.review-grid { display: grid; gap: 24px; }
@media (min-width: 900px) { .review-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.advice { border-left: 4px solid var(--accent); padding: 12px 16px; background: var(--accent-soft); margin-bottom: 20px; font-size: 16px; }
.advice b { display: block; }
details { margin: 16px 0; font-size: 16px; }
summary { cursor: pointer; font-weight: 600; }
dt { font-weight: 600; margin-top: 14px; }
dd { margin: 0 0 14px; white-space: pre-wrap; }
textarea { min-height: 88px; }
.proposal-label { display: block; font-size: 16px; margin-top: 14px; }
.page-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin: 24px 0; }
.page-actions .spacer { flex: 1; }
progress { width: 100%; height: 14px; accent-color: var(--primary); }
.readonly { background: var(--warn-bg); color: var(--warn-ink); padding: 14px; border-radius: 12px; }
.table-wrap { overflow: auto; max-height: 65vh; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; border-bottom: 1px solid var(--line); padding: 10px; vertical-align: top; }
th { position: sticky; top: 0; background: var(--card); }
.small { font-size: 14px; color: var(--muted); }
.error { color: var(--err-ink); background: var(--err-bg); padding: 14px; border-radius: 12px; }
.status-line { min-height: 1.8em; white-space: pre-wrap; }
@media (max-width: 600px) { .brand span { white-space: normal; font-size: 13px; } .nav { border-radius: 14px; } .save { white-space: normal; max-width: 130px; } .navr .btn { padding: 6px; font-size: 13px; } }
/* Project context precedes the questionnaire. */
.welcome { max-width: 940px; margin: 32px auto; }
.welcome-eyebrow { color: var(--primary); font-size: 13px; font-weight: 700; letter-spacing: .09em; margin-bottom: 10px; }
.welcome h1 { max-width: 760px; margin-top: 18px; margin-bottom: 26px; }
.welcome .lead { color: var(--muted); font-size: 21px; }
.context-steps { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 28px 0; }
.context-step { background: var(--soft); border-radius: 16px; padding: 24px; }
.context-step h2 { font-size: 23px; margin: 10px 0 16px; }
.context-step p:last-child { margin-bottom: 0; }
.before-start { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 28px; }
.before-start h2 { font-size: 24px; }
.data-source { background: var(--soft); border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin: 20px 0; }
.data-source h4 { font-size: 17px; line-height: 1.5; margin: 0 0 8px; }
.data-source-list { font-size: 15px; margin: 0; }
.data-source-list dt { margin-top: 12px; }
.data-source-list dd:last-child { margin-bottom: 0; }
.evidence-details { border-top: 1px solid var(--line); padding-top: 14px; margin-bottom: 24px; }
@media (max-width: 600px) {
  .welcome { margin-top: 14px; }
  .context-steps { grid-template-columns: 1fr; }
  .welcome .lead { font-size: 19px; }
  .data-source { padding: 16px; }
}
.project-sequence { padding-left: 25px; }
.project-sequence li { padding: 0 0 12px 8px; }
.project-sequence li::marker { color: var(--primary); font-weight: 700; }
.project-sequence li[aria-current="step"] { background: var(--accent-soft); border-radius: 10px; padding-top: 10px; padding-right: 12px; }
.project-sequence p { font-size: 16px; margin: 8px 0 10px; }
.intro-sources { border-top: 1px solid var(--line); padding-top: 14px; }
.module-screen { max-width: 1000px; margin-left: auto; margin-right: auto; }
.module-screen .question { margin: 30px 0; padding-top: 20px; border-top: 1px solid var(--line); }
.module-screen legend { line-height: 1.6; }
.module-screen .help { white-space: pre-wrap; }
.document-diagram { width: 100%; height: auto; display: block; }
figure { margin: 24px 0; }
.component { border: 1px solid var(--line); border-radius: 14px; padding: 20px; margin: 24px 0; }
.component h3 { margin-top: 0; }
.word-count { color: var(--muted); font-size: 13px; text-align: right; }
.word-count.over { color: var(--err-ink); }
